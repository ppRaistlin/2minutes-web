<!doctype html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2minutes — Sélection</title>
<style>
:root{color-scheme:dark;--bg:#080c14;--card:#121925;--line:#263247;--text:#f7f9fc;--muted:#92a0b6;--accent:#4d8dff}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 100% 0,#163467 0,transparent 34%),var(--bg);color:var(--text);font:14px Inter,system-ui,"Segoe UI",sans-serif}.wrap{padding:14px}.head{display:flex;align-items:center;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--line)}.head img{width:74px;height:52px;object-fit:contain}.head strong{font-size:16px}.head small{display:block;color:var(--muted);margin-top:2px}.card{margin-top:12px;padding:14px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(145deg,#141c29,#101722)}.label{font-size:11px;font-weight:800;margin-bottom:4px}.muted{color:var(--muted);font-size:11px;line-height:1.45}.target{margin-top:8px;color:#9fc0ff;font-size:12px;word-break:break-word}.preview{min-height:130px;max-height:260px;overflow:auto;margin-top:12px;padding:12px;border-radius:11px;border:1px solid #202b3c;background:#0b111b;white-space:pre-wrap;line-height:1.5}.preview.empty{display:flex;align-items:center;justify-content:center;text-align:center;color:#73839c}.status{margin-top:8px;font-size:11px;color:#8fa5c7}.status.error{color:#ff9a9a}.btn{width:100%;margin-top:12px;padding:10px 12px;border-radius:10px;border:1px solid #4d8dff66;background:#4d8dff18;color:#fff;font:inherit;font-weight:800;cursor:pointer}.btn:disabled{opacity:.38;cursor:default}.back{display:block;margin-top:10px;text-align:center;color:#9fc0ff;text-decoration:none;font-size:11px}.success{display:none;margin-top:12px;padding:10px;border-radius:10px;border:1px solid #3f8f68;background:#13251d;color:#dff8ea;font-weight:700;text-align:center}.success.show{display:block}.btn.publishing{cursor:wait;opacity:.8}body:has(.btn.publishing){cursor:progress}body:has(.btn.publishing) button{cursor:progress}
.tm-side-scales{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0}.tm-side-scale-item{min-width:0}.tm-side-scale-item small{color:#9fc0ff;font-size:11px;display:block;line-height:1.3;margin-bottom:5px;overflow-wrap:anywhere}
.review-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:14px}
.review-actions .btn{width:100%;min-width:0;margin-top:0;padding:11px 4px;font-size:12px;line-height:1.2}
.review-actions .btn.primary{background:#285caa;border-color:#4d8dff}
.review-actions .btn.danger{border-color:#be555580;color:#ffd9d9}
@media(max-width:335px){.review-actions{gap:5px}.review-actions .btn{font-size:11px;padding:10px 2px}} </style><link rel="stylesheet" href="editorial-scale.css"></head><body><main class="wrap"><header class="head"><img src="logo-transparent.png" alt="2minutes"><div><strong>Ajouter un point de vue</strong><small>Le panneau reste ouvert pendant votre sélection.</small></div></header><section class="card">
 <div id="step" class="label">Étape 2 / 4 — Passage source</div>
 <div id="target" class="target"></div><div id="workflowEditorialScales" class="tm-side-scales"></div>
 <details id="sourceDetails" style="display:none;margin-top:12px" open><summary>Passage source (voir / masquer)</summary><div id="sourcePreview" class="preview"></div></details>
 <div id="instruction" class="muted" style="margin-top:10px">Sélectionnez un passage dans l’article source.</div>
 <div id="preview" class="preview empty">En attente de sélection…</div>
 <div id="status" class="status" role="status"></div>
 <div id="review" style="display:none"><h3>Vérifier avant publication</h3><strong>Article source</strong><p id="reviewSource"></p><strong>Article lié</strong><p id="reviewTarget"></p><div class="review-actions" role="group" aria-label="Actions du récapitulatif">
 <button class="btn danger" id="reviewAbandon" type="button">Abandonner</button>
 <button class="btn" id="reviewRestart" type="button">Recommencer</button>
 <button class="btn primary" id="reviewPublish" type="button">Publier</button>
 </div></div>
 <button id="publish" class="btn" disabled>Valider la sélection</button>
 <button id="defer" class="btn" type="button">Sélectionner plus tard</button>
 <button id="cancel" class="btn" type="button">Abandonner le brouillon</button>
 <div id="success" class="success">✓ Liaison publiée</div>
 </section></main><script src="bias-data.js"></script><script src="editorial-scale.js"></script><script src="community-config.js"></script><script src="community.js"></script><script src="sidepanel.js"></script></body></html>

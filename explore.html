<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2minutes — Explorer d’autres sources</title><style>

ze:10px;color:#8fb2e8;white-space:nowrap}.candidateState{color:#71839b;font-size:11px;padding:5px 0}.candidateFallback{font-size:11px;color:#91a5c2;padding:4px 0}.candidateFallback a{color:#a7c4ff;text-decoration:none}.rssTag{display:inline-block;font-size:9px;color:#7fb0ff;border:1px solid #31517d;border-radius:999px;padding:2px 5px;margin-left:6px;vertical-align:1px}.mediaRow:last-child{border-bottom:0}.fav{width:32px;height:32px;border:1px solid #2a3a50;border-radius:9px;background:#101826;color:#7889a2;font-size:20px;line-height:1;display:grid;place-items:center;cursor:pointer;transition:.15s ease}.fav:hover{border-color:#5477aa;color:#d9e6f7;background:#142238}.fav.on{color:#ffd76a;border-color:#7a6430;background:#2a2415}.favoritesHint{margin:-2px 0 10px;color:#7f93af;font-size:11px}.mediaLink{color:#e4edf9;text-decoration:none;font-weight:650}.mediaLink:hover{color:#9fc0ff}.orientationBadge{display:inline-block;min-width:22px;margin-left:7px;padding:2px 5px;border-radius:999px;color:#fff;font-size:9px;font-weight:800;line-height:1.25;text-align:center;vertical-align:1px;box-shadow:0 0 0 1px #ffffff18}.domain{color:#6f8098;font-size:11px}.empty{padding:26px;text-align:center;color:var(--muted)}.quick{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0 0}.quickLabel{color:var(--muted);font-size:11px}.quick a{color:#a7c4ff;text-decoration:none;background:#4d8dff12;border:1px solid #4d8dff33;padding:6px 8px;border-radius:8px}.footer{text-align:center;color:#65758b;font-size:11px;margin-top:22px}@media(max-width:720px){.page{padding:0 18px}.top{align-items:flex-start;padding:18px 0 14px}.logo{width:110px;height:75px}.tabs{grid-template-columns:1fr 1fr}.headline h1{font-size:21px}.settings{flex-direction:column}.mediaRow{grid-template-columns:34px 1fr}.domain{grid-column:2}}
